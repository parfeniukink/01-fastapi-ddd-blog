[project]
name = "rest-ddd-fastapi-blog"
version = "0.4.0"
description = "FastAPI + DDD + REST — Iteration 04: role-aware publication lifecycle, split pipeline, persistence-vs-contract reject_message"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "pydantic-ai>=0.0.14",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
