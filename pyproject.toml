[project]
name = "rest-ddd-fastapi-blog"
version = "0.1.0"
description = "FastAPI + DDD + REST — dependency direction across iterations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "asyncpg>=0.29",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
